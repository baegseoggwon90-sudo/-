<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 영상 교체기 로그인</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c2230; --muted:#687080; --line:#dde1e8; --accent:#2f5bea; --accent-text:#fff; --err:#d93a32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121418; --card:#1c1f25; --text:#e7e9ee; --muted:#9aa1ad; --line:#2f333b; --accent:#6d93ff; --accent-text:#0d1220; --err:#ff6159; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  form { width:min(360px, 100%); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  h1 { margin:0 0 6px; font-size:20px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { width:100%; margin-top:12px; font:inherit; font-weight:600; padding:10px; border-radius:8px; border:none;
           background:var(--accent); color:var(--accent-text); cursor:pointer; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
<form id="f">
  <h1>🎬 한국 영상 교체기</h1>
  <p>비밀번호를 입력하세요.</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="비밀번호">
  <button type="submit">로그인</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (res.ok) location.reload();
  else err.textContent = (await res.json().catch(() => ({}))).error || "로그인 실패";
});
</script>
</body>
</html>
